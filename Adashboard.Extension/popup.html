<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Добавить карточку в Adashboard</title>
</head>

<body class="popup">
    <main>
        <h1>Добавить карточку</h1>

        <p id="status" class="status" role="status">Загрузка…</p>

        <p id="error" class="error" role="alert" hidden></p>

        <div class="actions">
            <button id="settings-button" type="button" class="button" hidden>Настройки</button>
            <button id="retry-button" type="button" class="button" hidden>Повторить</button>
        </div>

        <form id="card-form" hidden>
            <div class="field">
                <label for="title-input">Заголовок</label>
                <input id="title-input" type="text" autocomplete="off" spellcheck="false" />
            </div>

            <div class="field">
                <label for="url-input">Адрес страницы</label>
                <div class="url-row">
                    <label class="visually-hidden" for="scheme-select">Схема адреса</label>
                    <select id="scheme-select">
                        <option value="1">http://</option>
                        <option value="2">https://</option>
                    </select>
                    <input id="url-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" />
                </div>
            </div>

            <div class="field">
                <label for="page-select">Страница</label>
                <select id="page-select"></select>
            </div>

            <div class="field">
                <label for="category-select">Категория</label>
                <select id="category-select"></select>
            </div>

            <div id="icon-block" class="field icon-row" hidden>
                <span class="field-label">Иконка</span>

                <div class="icon-preview">
                    <img id="icon-image" alt="Предпросмотр иконки карточки" hidden />
                    <span id="icon-fallback" class="icon-glyph" title="fa-solid fa-link" hidden>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <path d="M10 13a5 5 0 0 0 7.07 0l2.12-2.12a5 5 0 0 0-7.07-7.07l-1.06 1.06" />
                            <path d="M14 11a5 5 0 0 0-7.07 0L4.81 13.12a5 5 0 0 0 7.07 7.07l1.06-1.06" />
                        </svg>
                    </span>
                    <span id="icon-status" class="status">Загружаю иконку…</span>
                </div>

                <div class="icon-actions">
                    <button id="icon-clear" type="button" class="button" hidden>Очистить</button>
                    <button id="icon-restore" type="button" class="button" hidden>Вернуть</button>
                </div>
            </div>

            <p id="color-row" class="field color-row" hidden>
                <span class="field-label" id="color-label">Цвет фона</span>

                <span class="color-swatch" role="img" aria-labelledby="color-label color-value"></span>
                <span id="color-value" class="color-value"></span>
            </p>

            <button id="save-button" type="submit" class="button primary" disabled>Сохранить</button>
        </form>
    </main>

    <script type="module" src="./src/popup.ts"></script>
</body>

</html>
