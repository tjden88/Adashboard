<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Базовый адрес: все относительные ссылки (в том числе на _framework) считаются от корня. -->
    <base href="/" />
    <title>Adashboard</title>

    <!-- Тема применяется до отрисовки, чтобы не было вспышки светлого фона при тёмной теме. -->
    <script>
        (function () {
            var isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        })();
    </script>

    <link rel="stylesheet" href="lib/fonts/fonts.css" />
    <link rel="stylesheet" href="lib/fa/css/fa.all.min.css" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/coloris/coloris.min.css" />
    <link rel="stylesheet" href="app.css" />
    <!-- Сгенерированный бандл изолированных стилей (.razor.css) всех компонентов. -->
    <link rel="stylesheet" href="Adashboard.styles.css" />

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="site.webmanifest" />
</head>

<body>
    <!-- Сюда монтируется корневой компонент (см. RootComponents в Program.cs). -->
    <div id="app">
        <div class="dashboard-loading" role="status" aria-live="polite" aria-label="Загрузка dashboard">
            <span class="dashboard-loading__spinner" aria-hidden="true"></span>
        </div>
    </div>

    <script src="lib/coloris/coloris.min.js"></script>
    <!-- Запускает загрузку .NET WebAssembly и старт приложения. -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
