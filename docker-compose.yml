services:
  adashboard:
    build: .
    image: adashboard:latest
    container_name: adashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Пустое значение отключает защиту API: весь API доступен без ключа.
      # Чтобы включить защиту, задайте свой ключ — не храните секрет в репозитории.
      ApiKey: ""
      # Второй ключ доступа для расширения браузера. Совпавший с ним запрос получает
      # полный доступ к API. Сам по себе защиту не включает: работает только когда задан ApiKey.
      ExtensionApiKey: ""
      LogLevel: Information
      # Часовой пояс контейнера: таймстампы логов печатаются в локальном времени процесса,
      # без TZ это UTC. Значение — IANA-имя зоны (например, Europe/Berlin или Asia/Almaty).
      TZ: Asia/Yekaterinburg
    volumes:
      # Каталог данных: data.db и uploads. Данные переживают пересоздание контейнера.
      - adashboard-data:/app/appdata

volumes:
  adashboard-data:
