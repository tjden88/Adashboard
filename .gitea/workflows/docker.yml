name: Build Docker image

on:
  pull_request:
    types: [closed]

jobs:
  build:
    if: >
      gitea.event.pull_request.merged == true &&
      gitea.event.pull_request.base.ref == 'master'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Login to Gitea Registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login git.tjpro.ru \
            --username "$REGISTRY_USER" \
            --password-stdin

      - name: Calculate image tag
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          DATE=$(date +'%d.%m.%y')

          TAGS=$(curl \
            --fail \
            --silent \
            --show-error \
            --user "$REGISTRY_USER:$REGISTRY_TOKEN" \
            "https://git.tjpro.ru/v2/r/adashboard/tags/list?n=10000" \
            | jq -r '.tags[]?')

          LAST=$(
            printf '%s\n' "$TAGS" |
            awk -F. -v prefix="$DATE" '
              $1 "." $2 "." $3 == prefix && $4 ~ /^[0-9]+$/ {
                if ($4 > max) max = $4
              }
              END {
                print max + 0
              }
            '
          )

          VERSION_TAG="${DATE}.$((LAST + 1))"

          echo "Today:      $DATE"
          echo "Previous:   $LAST"
          echo "New tag:    $VERSION_TAG"

          printf '%s' "$VERSION_TAG" > /tmp/image-tag

      - name: Build and push Docker image
        run: |
          set -euo pipefail

          VERSION_TAG=$(cat /tmp/image-tag)

          docker buildx build \
            --push \
            --tag "git.tjpro.ru/r/adashboard:latest" \
            --tag "git.tjpro.ru/r/adashboard:${VERSION_TAG}" \
            --cache-from "type=registry,ref=git.tjpro.ru/r/adashboard:latest" \
            --cache-to "type=inline" \
            .